<script>
(() => {
  const flood = document.getElementById('worksFlood');
  const bg = document.getElementById('worksFloodBg');
  const seen = new Set();
  flood.addEventListener('pointerover', e => {
    const a = e.target.closest('a[data-img]');
    if (!a) return;
    if (!seen.has(a.dataset.img)) { new Image().src = a.dataset.img; seen.add(a.dataset.img); }
    bg.style.backgroundImage = `url("${a.dataset.img}")`;
    flood.classList.add('lit');
  });
  flood.addEventListener('pointerleave', () => flood.classList.remove('lit'));
})();
